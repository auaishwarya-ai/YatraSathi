{% extends 'base.html' %}
{% block title %}{{ code }} · YatraSathi{% endblock %}
{% block content %}
<div class="container page">
  <div class="card empty-state" style="max-width:560px;margin:40px auto">
    <i data-lucide="{{ 'lock' if code == 403 else 'compass' }}"></i>
    <h1>{{ code }}</h1>
    <p>{{ _(message) }}</p>
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">{{ _('Back to Home') }}</a>
  </div>
</div>
{% endblock %}
